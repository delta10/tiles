version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    rebase-strategy: auto
    labels:
      - dependencies
      - python
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    groups:
      python-runtime:
        dependency-type: production
        patterns:
          - "titiler*"
          - "uvicorn*"
          - "fastapi*"
          - "starlette*"
          - "rio-tiler*"
      python-dev:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
