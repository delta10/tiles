[project]
name = "tiles"
version = "0.1.0"
description = "Tile service for configured COG layers as TMS and WMTS."
requires-python = ">=3.14,<3.15"
dependencies = [
    "titiler.core==2.4.0",
    "titiler.extensions==2.4.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.21",
]

[tool.ruff]
line-length = 100
target-version = "py314"
