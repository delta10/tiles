[project]
name = "tiles"
version = "0.1.0"
description = "Tile service for configured COG layers as TMS and WMTS."
requires-python = "==3.14.4"
dependencies = [
    "titiler.core==2.0.5",
    "titiler.extensions==2.0.5",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py314"
